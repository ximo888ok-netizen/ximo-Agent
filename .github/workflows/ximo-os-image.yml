name: ximo-OS 镜像

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'os/**'
      - 'src/host/**'
      - 'tests/host/**'
      - 'scripts/host-build.mjs'
      - 'src/main/Permission.ts'
      - 'src/main/security-guard.ts'
      - 'src/shared/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（跳过 electron 二进制下载）
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: 构建主机运行时（agent-hostd.cjs）+ 清点 + 权限矩阵自检
        run: npm run host:build   # 链内含 host-verify（工具清点）+ host-perm-verify（铁门槛⑥）

      - name: 安装 mkosi 与 qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils python3-pefile systemd-ukify systemd-boot debian-archive-keyring mtools
          # mkosi 25.3 取自 Debian trixie 官方 deb — PyPI 无发布；
          # noble apt 版 24.3 的工具树包清单用旧名（t64 改名后失效）
          curl -fsSL -o /tmp/mkosi.deb http://deb.debian.org/debian/pool/main/m/mkosi/mkosi_25.3-7_all.deb
          # 解包 + 包装脚本 — 自带 PYTHONPATH（sudo 会剥离环境变量），root/普通用户均可见
          sudo dpkg-deb -x /tmp/mkosi.deb /opt/mkosi-253
          printf '#!/bin/sh\nPYTHONPATH=/opt/mkosi-253/usr/lib/python3/dist-packages exec /usr/bin/python3 /opt/mkosi-253/usr/bin/mkosi "$@"\n' | sudo tee /usr/local/bin/mkosi > /dev/null
          sudo chmod +x /usr/local/bin/mkosi
          /usr/local/bin/mkosi --version

      - name: 构建 ximo-OS 0.1 磁盘镜像（含 CI apiKey 注入）
        # root 运行 — Ubuntu 24.04 AppArmor 限制非特权 userns，mkosi 无根构建
        # 会报 Operation not permitted / uid 65436 映射失败；root 直建绕过
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: sudo -E bash os/scripts/build-image.sh

      - name: 引导冒烟（QEMU TCG — 移除 continue-on-error，红灯即 CI 红）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cd os/mkosi
          # guest 控制台（console=hvc0 → mkosi 的 stdio chardev）重定向到文件 — 提取令牌用
          # （agent-hostd.service 已 journal+console 双写；journal+console 落到 /dev/console=hvc0）
          # hostfwd 在 mkosi.conf [Runtime] QemuArgs 里定义（mkosi 25.3 无 --qemu-args，
          # 未知参数原样透传给 qemu 直接报 invalid option —— 历史假绿的根因）
          # 必须与构建同样 sudo：AppArmor 限制非特权 userns，mkosi 的沙箱 unshare 会被拒
          sudo -E mkosi qemu > /tmp/guest-console.log 2>&1 &
          QPID=$!
          # ⚠ 不能用端口探测判断就绪：hostfwd 的宿主端口在 qemu 启动瞬间就被
          # slirp 接受（假阳性）。可靠信号 = 令牌出现在 guest 控制台
          # （agent-hostd 首启回显经 journal+console → hvc0 → mkosi stdout）
          TOKEN=""
          for i in $(seq 1 120); do
            TOKEN="$(grep -oP 'token = \K\S+' /tmp/guest-console.log 2>/dev/null | head -1 | tr -d '\r\n')" || true
            [ -n "$TOKEN" ] && break
            sleep 4
          done
          if [ -z "$TOKEN" ]; then
            echo "❌ 480s 内 guest 控制台未出现令牌 — 诊断信息："
            echo "  --- guest 控制台尾部 ---"
            sudo tail -80 /tmp/guest-console.log || echo "  （控制台日志为空/不存在）"
            sudo pkill -f qemu-system-x86_64 || true
            exit 1
          fi
          echo "✅ 令牌已提取（长度 ${#TOKEN}）"
          # 开机品牌画面必须在控制台出现。
          # ⚠ 断言必须匹配 splash **独有**字符串：先前用 'ximo-OS' 会命中别处
          # （尤其 run: 块源码本身会被回显进日志）→ 假阳性。'Agent-Native' 与
          # 块字符 '◉' 只可能来自 splash 脚本。
          # 无论成败都打印命中片段 —— 断言必须自证，不能只看 ✅/❌
          echo "---- 开机品牌画面检查（guest 控制台）----"
          if grep -q 'Agent-Native Linux' /tmp/guest-console.log; then
            echo "✅ 开机品牌画面已呈现"
          else
            echo "⚠ 未匹配到 splash 独有标记，打印含 ximo 的上下文供核对："
          fi
          grep -n 'ximo\|Agent-Native\|◉' /tmp/guest-console.log | head -30 || echo "（无匹配行）"
          if ! grep -q 'Agent-Native Linux' /tmp/guest-console.log; then
            echo "❌ 开机品牌画面缺失 — ximo-splash.service 未生效或被静默跳过"
            echo "---- 控制台头部 40 行（引导最早阶段）----"
            sudo head -40 /tmp/guest-console.log || true
            sudo pkill -f qemu-system-x86_64 || true
            exit 1
          fi
          # [3] GET /api/health 返回 200
          HEALTH=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" http://127.0.0.1:17890/api/health)
          if [ "$HEALTH" != "200" ]; then
            echo "❌ /api/health 返回 $HEALTH（期望 200）"
            sudo pkill -f qemu-system-x86_64 || true
            exit 1
          fi
          echo "✅ /api/health 返回 200"
          # 接入 verify-image.mjs 的完整验收（health/令牌/派任务/审批/桌面在环）
          # 无 DEEPSEEK_API_KEY secret 时任务会失败 — 那时仅 health 通过即冒烟绿
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            node "$GITHUB_WORKSPACE/os/scripts/verify-image.mjs" --token "$TOKEN" --port 17890 --ssh-port 12222 --require-desktop
            VRC=$?
            if [ "$VRC" != "0" ]; then
              echo "---- verify-image 未全过，倾倒 guest 控制台尾部（agent-hostd 日志）----"
              sudo tail -60 /tmp/guest-console.log || true
            fi
          else
            echo "⚠ 无 DEEPSEEK_API_KEY secret — 跳过 WS 派任务（health 200 已通过）"
            VRC=0
          fi
          # 启动期不得出现 electron 解析失败 —— store.saveSettings 的动态
          # import('electron') 会被 shim 的 CJS 钩子漏掉（ESM 解析），异常被
          # catch 吞掉导致 settings.json 从未写入（本轮 CI 实测抓到）。这是 CI
          # 侧独有的可复现环境（单测里 electron 被 mock，测不出来）。
          if sudo grep -q 'Cannot find package .electron.' /tmp/guest-console.log; then
            echo "❌ 启动日志出现 electron 解析失败 —— settings 未落盘（见 store.ts 主机运行时分支）"
            sudo grep -n 'Cannot find package' /tmp/guest-console.log | head -5
            sudo pkill -f qemu-system-x86_64 || true
            exit 1
          fi
          echo "✅ 启动日志无 electron 解析失败"
          sudo pkill -f qemu-system-x86_64 || true
          exit $VRC

      - name: 上传镜像工件
        uses: actions/upload-artifact@v4
        with:
          name: ximo-os-0.1-raw
          path: os/mkosi/out/*.raw
          retention-days: 7
          # 压缩：raw 是稀疏文件（逻辑 1.2GB / 实占 839MB，约 360MB 空洞），
          # 开压缩后空洞近乎免费（原先 compression-level: 0 按 1.2GB 全量传输）
          compression-level: 6

  xvfb-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（跳过 electron 二进制下载）
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: 安装 X 桌面栈
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool wmctrl xclip imagemagick openbox xterm

      - name: Xvfb 在环集成测试
        run: |
          # xvfb-run 提供虚拟 X 显示，openbox 作窗口管理器，xterm 提供可驱动窗口
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            openbox &
            sleep 1
            export DISPLAY=$DISPLAY
            npx vitest run tests/host/desktop-bus-xvfb.test.ts
          '