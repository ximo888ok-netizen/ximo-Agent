# mkosi 主配置 — ximo-OS 0.1（阶段 1）
# 目标：Debian trixie 底座 + nodejs + agent-hostd 开机自启，无 GUI（headless），
# 控制面只有 SSH(22) 与 cockpit-link(17890)。
#
# ⚠️ 语法注意（mkosi 25.3，均经 `mkosi summary` 二分实验确证）：
#  1. Packages= = 逗号分隔（多值项）。summary 里显示的续行缩进只是**展示格式**，
#     不要据首行判断是否解析成功——用 `mkosi summary | sed -n '/CONTENT:/,/^$/p'`
#     看整段。
#  2. PostInstallationScripts= 必须放在 **[Content] 段**。放在 [Execution] 段会被
#     静默忽略（实测 summary 显示 none），导致 postinstall 不执行——镜像里因此
#     缺 ximo-host 用户、hostname 未改。曾据此误判「镜像无 ximo-OS 定制」。

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
ImageId=ximo-os
ImageVersion=0.1
# 磁盘镜像（GPT/UEFI）；QEMU/Hyper-V 用，转 VHDX 见 os/README.md
Format=disk
OutputDirectory=out

[Build]
# UseSubvolumes 只是 mkosi **构建期**的加速优化（用 btrfs 子卷做快速树拷贝），
# 与「镜像内 root 是 btrfs」无关——后者由 mkosi.repart/10-root.conf 的 Format=btrfs 决定。
# auto：构建目录在 btrfs 上则启用（快），否则忽略（CI runner 的 /var/tmp 是 ext4，
# 用 yes 会硬报错 "Subvolumes requested but ... is not located on a btrfs filesystem"）。
UseSubvolumes=auto

[Content]
# 逗号分隔（25.3 语法）— 含镜像内 UEFI 引导加载器（bootctl install 从镜像取）
# 桌面栈（阶段 B1）：xvfb+openbox 提供 X 会话（:99），xdotool/wmctrl/xclip 是
# desktop-bus 的执行层，ffmpeg=画面流 / imagemagick=单帧截图（vision 回路）
Packages=systemd,systemd-sysv,systemd-boot-efi,systemd-resolved,dbus,openssh-server,linux-image-amd64,nodejs,ca-certificates,curl,locales,bash,login,xvfb,openbox,xdotool,wmctrl,xclip,ffmpeg,imagemagick,chromium,libreoffice-writer,libreoffice-calc,libreoffice-impress,rsync,auditd,btrfs-progs
# 串行控制台 — QEMU TCG -nographic 可见启动与登录提示（无 VT-x 本地方案配套）
KernelCommandLine=console=ttyS0

# 镜像覆盖树 — 主机运行时产物 + systemd 单元 + wants 软链（启用不依赖脚本时序）
# 由 build-image.sh 归集生成：
#   opt/ximo-host/dist-host/agent-hostd.cjs
#   etc/systemd/system/agent-hostd.service
#   etc/systemd/system/ximo-os-firstboot.service
#   etc/systemd/system/multi-user.target.wants/*（相对软链）
#   usr/local/sbin/ximo-os-firstboot.sh
ExtraTrees=artifacts/image-overlay

# PostInstallationScripts 必须在 [Content] 段（见上方语法注意 2）
PostInstallationScripts=provision/postinstall.sh

[Runtime]
# CI 冒烟的端口转发走这里：mkosi 25.3 没有 --qemu-args（未知参数原样透传给 qemu，
# qemu 报 invalid option —— 历史上的「冒烟通过」实为 continue-on-error 掩盖的假绿）。
# RuntimeNetwork=none 关掉 mkosi 自带的 -nic，由 QemuArgs 提供带 hostfwd 的用户态网卡
# （guest 内 networkd 对任一接口 DHCP，stub 的 ip= 参数已覆盖）
RuntimeNetwork=none
QemuArgs=-nic user,model=virtio-net-pci,hostfwd=tcp::12222-:22,hostfwd=tcp::17890-:17890

