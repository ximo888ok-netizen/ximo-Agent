# 与 mkosi 25.3 内置默认的 10-root.conf 逐字一致，仅把 Format 从发行版默认
# （ext4）换成 btrfs —— 阶段 D5 的 btrfs 子卷快照依赖它。
#
# ⚠ 提供 mkosi.repart/ 后 mkosi **不再使用任何内置默认分区定义**，
# 因此 00-esp.conf 必须同时存在（否则镜像不可引导）。改动此目录后
# 务必跑 os/scripts/build-image.sh（内含 mkosi summary 断言）与 CI 引导冒烟。
#
# Minimize=guess 保持默认：mkosi 会收缩 btrfs 到最小尺寸，避免镜像虚胖。
[Partition]
Type=root
Format=btrfs
CopyFiles=/
Minimize=guess
